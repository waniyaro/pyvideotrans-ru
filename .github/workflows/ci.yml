name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 requests aiohttp httpx tenacity

      - name: Test Python syntax and toolkit
        run: |
          python -m py_compile sp.py
          python videotrans/util/voice_toolkit.py --help
          python -c "from videotrans.util.voice_toolkit import clean_text; res = clean_text('эээ типа привет'); assert res == 'Привет'"
